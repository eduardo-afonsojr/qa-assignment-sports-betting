[pytest]
testpaths = tests

# Put the project root on sys.path so `config`, `api` and `pages` import under
# the bare `pytest` command. Without this the suite only runs via
# `python -m pytest`, which adds the working directory implicitly.
pythonpath = .
markers =
    ui: browser-driven end-to-end tests (slower, require Chrome)
    api: HTTP-level tests (fast, no browser)
addopts = -v -ra --strict-markers --tb=short
