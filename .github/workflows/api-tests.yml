name: API tests

# The API suite is fast and needs no browser, so it runs on every push.
# The UI suite is deliberately not run here: it drives a real Chrome session
# against a live application and belongs on a pull-request or scheduled
# trigger, not on every commit.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run API tests
        env:
          # Configure this in Settings > Secrets and variables > Actions.
          # The suite targets a live application, so without it every request
          # is rejected with 401 and the job fails at the first test.
          USER_ID: ${{ secrets.USER_ID }}
          HEADLESS: "true"
        run: pytest -m api
